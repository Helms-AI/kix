[package]
name = "kix-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MCP server for Knowledge Indexer"

[dependencies]
kix-store = { path = "../kix-store" }
kix-embeddings = { path = "../kix-embeddings" }
kix-parser = { path = "../kix-parser" }
kix-crawler = { path = "../kix-crawler" }
kix-jobs = { path = "../kix-jobs" }
kix-projects = { path = "../kix-projects" }
rmcp.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
async-trait.workspace = true
reqwest = { version = "0.12", features = ["json"] }
url = "2.5"
sha2 = "0.10"
uuid = { version = "1.11", features = ["v4"] }
chrono = { workspace = true }
schemars = "1.2"

[dev-dependencies]
tempfile = "3"
