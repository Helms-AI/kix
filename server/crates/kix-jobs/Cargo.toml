[package]
name = "kix-jobs"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Job queue and executor for Knowledge Indexer"

[dependencies]
# Core dependencies
tokio = { workspace = true }
tokio-stream = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }

# Job queue and state management
dashmap = { workspace = true }
crossbeam-queue = { workspace = true }
priority-queue = "2.1"

# Persistence
sqlx = { workspace = true, optional = true }
bincode = "1.3"

# Cancellation and synchronization
tokio-util = "0.7"

# Resource monitoring
sysinfo = "0.32"
num_cpus = "1.16"

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Logging
tracing = { workspace = true }

# Unique IDs
uuid = { workspace = true, features = ["v4", "serde"] }
ulid = "1.1"

# URL parsing
url = "2.5"

# Hashing
sha2 = "0.10"

# SSE integration
kix-sse = { path = "../kix-sse" }

# Content processing
kix-store = { path = "../kix-store" }
kix-embeddings = { path = "../kix-embeddings" }
kix-parser = { path = "../kix-parser" }
kix-crawler = { path = "../kix-crawler" }

[features]
default = ["persistence", "fastembed-backend"]
persistence = ["sqlx"]
fastembed-backend = ["kix-embeddings/fastembed-backend"]

[dev-dependencies]
tempfile = "3.14"
