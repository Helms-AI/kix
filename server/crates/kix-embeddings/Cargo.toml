[package]
name = "kix-embeddings"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Ollama-based embedding generation for Knowledge Indexer"

# No features - Ollama-only architecture
[features]
default = []

[dependencies]
kix-parser = { path = "../kix-parser" }

# Ollama embedding client
ollama-rs = { workspace = true }

# Async runtime
tokio = { workspace = true }

# Serialization
serde.workspace = true
serde_json = "1.0"

# Error handling
thiserror.workspace = true

# Logging
tracing.workspace = true

# URL parsing
url = "2.5"

# Async futures
futures = "0.3"

# Keyword extraction for auto-tagging
keyword_extraction = { version = "1.5", features = ["rake", "tf_idf"] }
stop-words = "0.8"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
