[package]
name = "kix-embeddings"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Embedding generation and auto-tagging for Knowledge Indexer"

[features]
default = ["onnx-backend"]
# Backend selection
fastembed-backend = ["fastembed"]
onnx-backend = ["ort", "ureq", "dirs", "tokenizers"]
onnx-cuda = ["onnx-backend", "ort/cuda"]
onnx-coreml = ["onnx-backend", "ort/coreml"]
# Legacy GPU features (mapped to new backends)
cuda = ["onnx-cuda"]
coreml = ["onnx-coreml"]

[dependencies]
kix-parser = { path = "../kix-parser" }
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true
num_cpus = "1.16"  # For detecting CPU cores

# Embedding backends (optional)
fastembed = { workspace = true, optional = true }
ort = { version = "=2.0.0-rc.10", features = ["download-binaries"], optional = true }

# Model downloading for ONNX backend
ureq = { version = "2.9", optional = true }
dirs = { version = "5.0", optional = true }

# Tokenization for ONNX backend (proper HuggingFace tokenizer)
tokenizers = { version = "0.20", optional = true }

# Keyword extraction for auto-tagging
keyword_extraction = { version = "1.5", features = ["rake", "tf_idf"] }
stop-words = "0.8"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
