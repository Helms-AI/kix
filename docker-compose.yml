services:
  # Ollama - Local LLM/Embedding server with GPU acceleration
  # Automatically uses Metal (macOS) or CUDA (NVIDIA) when available
  ollama:
    image: ollama/ollama:latest
    container_name: kix-ollama
    ports:
      - "11434:11434"
    volumes:
      # Persist downloaded models
      - ollama-models:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    # Uncomment for NVIDIA GPU support:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # Model setup job - pulls nomic-embed-text on first run
  # Run with: docker compose run --rm ollama-setup
  ollama-setup:
    image: ollama/ollama:latest
    container_name: kix-ollama-setup
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Pulling nomic-embed-text model..."
        ollama pull nomic-embed-text
        echo "Model pull complete!"
    profiles:
      - setup

  # Kix API Server - serves REST API for the dashboard
  # Uses Ollama backend with nomic-embed-text embeddings (768 dimensions)
  # Hybrid architecture: SQLite for metadata, LanceDB for vectors
  kix-api:
    build:
      context: .
      dockerfile: server/Dockerfile
      args:
        # CPU optimization level: native, x86-64-v3 (default), or x86-64
        TARGET_CPU: ${TARGET_CPU:-x86-64-v3}
    container_name: kix-api
    ports:
      - "3001:3001"
    volumes:
      # Persist SQLite data (metadata, projects, issues, etc.)
      - kix-sqlite-data:/app/data/sqlite
      # Persist LanceDB data (vector embeddings only)
      - kix-lancedb-data:/app/data/lancedb
      # Persist model cache (fallback for non-Ollama backends)
      - kix-model-cache:/app/cache
    environment:
      - RUST_LOG=info
      # Hybrid storage paths
      - KIX_DATA_DIR=/app/data
      - KIX_SQLITE_PATH=/app/data/sqlite/kix.db
      - KIX_LANCE_PATH=/app/data/lancedb/vectors.lance
      - KIX_DB_PATH=/app/data/lancedb
      - KIX_API_PORT=3001
      # Ollama embedding configuration (primary)
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=nomic-embed-text
      - KIX_EMBEDDING_DIM=768
      # Cache directory for fallback models
      - XDG_CACHE_HOME=/app/cache
      # Performance settings
      - MALLOC_CONF=background_thread:true,dirty_decay_ms:1000,muzzy_decay_ms:1000
    command: ["kix", "api", "--port", "3001", "--db-path", "/app/data/lancedb"]
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # React Dashboard served by nginx
  kix-web:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: kix-web
    ports:
      - "3000:80"
    volumes:
      - ./client/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - kix-api
    restart: unless-stopped

  # One-time stats/utility job (run with: docker compose run --rm kix-tools)
  kix-tools:
    build:
      context: .
      dockerfile: server/Dockerfile
      args:
        TARGET_CPU: ${TARGET_CPU:-x86-64-v3}
    container_name: kix-tools
    volumes:
      - kix-sqlite-data:/app/data/sqlite
      - kix-lancedb-data:/app/data/lancedb
      - kix-model-cache:/app/cache
    environment:
      - RUST_LOG=info
      # Hybrid storage paths
      - KIX_DATA_DIR=/app/data
      - KIX_SQLITE_PATH=/app/data/sqlite/kix.db
      - KIX_LANCE_PATH=/app/data/lancedb/vectors.lance
      - KIX_DB_PATH=/app/data/lancedb
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=nomic-embed-text
      - KIX_EMBEDDING_DIM=768
      - XDG_CACHE_HOME=/app/cache
      - MALLOC_CONF=background_thread:true,dirty_decay_ms:1000,muzzy_decay_ms:1000
    command: ["kix", "stats", "--db-path", "/app/data/lancedb"]
    depends_on:
      ollama:
        condition: service_healthy
    profiles:
      - tools

volumes:
  ollama-models:
    driver: local
  kix-sqlite-data:
    driver: local
  kix-lancedb-data:
    driver: local
  kix-model-cache:
    driver: local
