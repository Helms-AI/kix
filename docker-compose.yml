services:
  # Kix API Server - serves REST API for the dashboard
  # Uses ONNX Runtime backend with BGE-base embeddings (768 dimensions)
  kix-api:
    build:
      context: .
      dockerfile: server/Dockerfile
      args:
        # CPU optimization level: native, x86-64-v3 (default), or x86-64
        TARGET_CPU: ${TARGET_CPU:-x86-64-v3}
    container_name: kix-api
    ports:
      - "3001:3001"
    volumes:
      # Persist LanceDB data
      - kix-lancedb-data:/app/data/lancedb
      # Persist ONNX model cache (BGE embeddings ~400MB)
      - kix-model-cache:/app/cache
    environment:
      - RUST_LOG=info
      - KIX_DB_PATH=/app/data/lancedb
      - KIX_API_PORT=3001
      # ONNX embedding model configuration
      - KIX_EMBEDDING_MODEL=${KIX_EMBEDDING_MODEL:-bge-base-en-v1.5}
      - KIX_EMBEDDING_DIM=${KIX_EMBEDDING_DIM:-768}
      # Cache directory for models
      - XDG_CACHE_HOME=/app/cache
      # Performance settings
      - MALLOC_CONF=background_thread:true,dirty_decay_ms:1000,muzzy_decay_ms:1000
    command: ["kix", "api", "--port", "3001", "--db-path", "/app/data/lancedb"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s  # Allow time for model download on first run
    restart: unless-stopped

  # React Dashboard served by nginx
  kix-web:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: kix-web
    ports:
      - "3000:80"
    volumes:
      - ./client/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - kix-api
    restart: unless-stopped

  # One-time stats/utility job (run with: docker compose run --rm kix-tools)
  kix-tools:
    build:
      context: .
      dockerfile: server/Dockerfile
      args:
        TARGET_CPU: ${TARGET_CPU:-x86-64-v3}
    container_name: kix-tools
    volumes:
      - kix-lancedb-data:/app/data/lancedb
      - kix-model-cache:/app/cache
    environment:
      - RUST_LOG=info
      - KIX_DB_PATH=/app/data/lancedb
      - KIX_EMBEDDING_MODEL=${KIX_EMBEDDING_MODEL:-bge-base-en-v1.5}
      - KIX_EMBEDDING_DIM=${KIX_EMBEDDING_DIM:-768}
      - XDG_CACHE_HOME=/app/cache
      - MALLOC_CONF=background_thread:true,dirty_decay_ms:1000,muzzy_decay_ms:1000
    command: ["kix", "stats", "--db-path", "/app/data/lancedb"]
    profiles:
      - tools

  # Model setup job (run with: docker compose run --rm kix-setup)
  kix-setup:
    build:
      context: .
      dockerfile: server/Dockerfile
      args:
        TARGET_CPU: ${TARGET_CPU:-x86-64-v3}
    container_name: kix-setup
    volumes:
      - kix-model-cache:/app/cache
    environment:
      - RUST_LOG=info
      - KIX_EMBEDDING_MODEL=${KIX_EMBEDDING_MODEL:-bge-base-en-v1.5}
      - XDG_CACHE_HOME=/app/cache
    command: ["kix", "setup"]
    profiles:
      - setup

volumes:
  kix-lancedb-data:
    driver: local
  kix-model-cache:
    driver: local
